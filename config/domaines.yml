# ============================================================================
# DOMAINES DE VEILLE & MOTEUR DE CLASSIFICATION
# ============================================================================
# Chaque item collecté est comparé aux listes de mots-clés :
#   - un mot-clé "fort" dans le TITRE      vaut ponderations.fort x ponderations.titre
#   - un mot-clé "moyen" dans le TITRE     vaut ponderations.moyen x ponderations.titre
#   - un mot-clé "fort" dans le RÉSUMÉ     vaut ponderations.fort x ponderations.resume
#   - un mot-clé "moyen" dans le RÉSUMÉ    vaut ponderations.moyen x ponderations.resume
# Un item est rattaché à un domaine si son score local >= seuils.attribution.
# La correspondance est insensible à la casse et aux accents ; les mots-clés
# peuvent être en français OU en anglais (les avis des bailleurs sont bilingues).
# ============================================================================

